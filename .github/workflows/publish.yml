name: Publish to crates.io

# Publishes a GitHub release to https://crates.io/crates/oxinsider through
# crates.io trusted publishing: no API token is stored anywhere. The crate's
# trusted-publisher entry names this repository, this workflow file and the
# `crates-io` environment; see RELEASING.md for the one-time setup.
#
# A release tag must be v<version> of Cargo.toml. A version already on
# crates.io is skipped, not failed. `dry_run` (dispatch only) runs every check
# and `cargo publish --dry-run` without the token exchange.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and package, but do not publish."
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' -A "0xinsider-rust-publish" "https://crates.io/api/v1/crates/oxinsider/${version}")"
          case "$status" in
            200) echo "oxinsider ${version} is already on crates.io; nothing to publish."; echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered ${status}; refusing to guess whether ${version} is published"; exit 1 ;;
          esac
      - name: Test
        if: steps.version.outputs.published == 'false'
        run: |
          python3 scripts/generate.py --check
          cargo test --locked
      - name: Package
        if: steps.version.outputs.published == 'false'
        run: cargo publish --locked --dry-run
      - name: Exchange the OIDC token for a crates.io token
        if: steps.version.outputs.published == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.version.outputs.published == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
