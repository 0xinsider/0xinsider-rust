name: Regenerate from the published OpenAPI document

# Weekly, and on demand: when https://0xinsider.com/api/v1/openapi.json no
# longer matches the committed openapi.json, regenerate, run the offline and
# sandbox tests, and open a pull request with the result in its body. A pull
# request opened with GITHUB_TOKEN does not start other workflows, so the test
# outcome is recorded here rather than left to CI.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compare the published document with the committed one
        id: compare
        run: |
          set -euo pipefail
          curl -fsSL -A "0xinsider-rust-generator" https://0xinsider.com/api/v1/openapi.json -o "$RUNNER_TEMP/openapi.json"
          published="$(sha256sum "$RUNNER_TEMP/openapi.json" | cut -d' ' -f1)"
          committed="$(sha256sum openapi.json | cut -d' ' -f1)"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$committed" ]; then
            echo "The published document is the committed one ($committed)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate
        if: steps.compare.outputs.changed == 'true'
        env:
          # Resolves the app commit that last changed the document. The app
          # repository is private: without a token that can read it, provenance
          # records APP_COMMIT = None rather than a guess.
          GH_TOKEN: ${{ secrets.OXINSIDER_APP_READ_TOKEN }}
        run: python3 scripts/generate.py
      - name: Test the regenerated client
        if: steps.compare.outputs.changed == 'true'
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo clippy --all-targets -- -D warnings
            cargo test
            OXINSIDER_SANDBOX_TESTS=1 cargo test --test sandbox
          } 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Open a pull request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.test.outcome }}
          PUBLISHED: ${{ steps.compare.outputs.published }}
        run: |
          set -euo pipefail
          branch="regenerate/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: regenerate from the published OpenAPI document (sha256 ${PUBLISHED:0:12})"
          git push --force origin "$branch"
          {
            echo "The document at https://0xinsider.com/api/v1/openapi.json changed (sha256 \`$PUBLISHED\`)."
            echo "Generated by \`scripts/generate.py\`. Review the diff, bump the version in Cargo.toml, and publish a release after merging."
            echo
            echo "Tests after regenerating: **$OUTCOME**"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/test.log" || true
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --title "Regenerate from the published OpenAPI document" --body-file "$RUNNER_TEMP/body.md" --head "$branch" \
            || gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
